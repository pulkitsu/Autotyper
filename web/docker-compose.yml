services:
  postgres:
    image: postgres:16-alpine
    container_name: autotyper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotyper
      POSTGRES_USER: autotyper
      POSTGRES_PASSWORD: autotyper
    ports:
      - "5432:5432"
    volumes:
      - autotyper-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  autotyper-postgres-data:
